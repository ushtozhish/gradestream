name: Build and measure

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Build Windows installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Install osslsigncode (to verify cloudflared's signature)
        run: sudo apt-get update && sudo apt-get install -y osslsigncode
      - name: Build
        run: ./build/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: GradeStream-Setup
          path: dist/*.exe

  measure:
    name: Measure color, A/V sync, frame pacing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Build the app for Linux (test build)
        working-directory: app
        run: go build -mod=mod -o gs-test .
      - name: Install Playwright Chromium
        working-directory: tests
        run: npm install && npx playwright install --with-deps chromium
      - name: Run measurements
        run: ./tests/run-all.sh
      - name: Publish results
        if: always()
        run: cat tests/results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: measurements
          path: |
            tests/results.md
            tests/color_*.json
            tests/gs.log
            tests/shots/*.png

  release:
    # A vX.Y.Z tag publishes a release: the installer zipped (browsers and mail are friendlier to .zip than .exe),
    # its SHA-256, and the notes from .github/release-notes.md (EN → RU → KZ).
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installer, measure]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: GradeStream-Setup
          path: dist
      - name: Zip and checksum
        run: |
          cd dist
          exe=$(ls GradeStream-Setup-*.exe)
          zip -9 "${exe%.exe}.zip" "$exe"
          sha=$(sha256sum "$exe" | cut -d' ' -f1)
          cp ../.github/release-notes.md notes.md
          printf '\nSHA-256 of `%s`: `%s`\n' "$exe" "$sha" >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "GradeStream ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md
