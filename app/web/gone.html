<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream ended</title></head>
<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#999;font:16px -apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box">
<div id="m">The stream has ended or the link is out of date.<br><br>Ask the colorist to send you a new link.</div>
<script>
if (['ru', 'kk', 'be', 'uk'].includes((navigator.language || '').slice(0, 2))) {
  document.documentElement.lang = 'ru'; document.title = 'Трансляция завершена';
  document.getElementById('m').innerHTML = 'Трансляция завершена или ссылка устарела.<br><br>Попросите колориста прислать новую ссылку.';
}
</script></body></html>
