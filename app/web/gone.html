<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream ended</title></head>
<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#999;font:16px -apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box">
<div id="m">The stream has ended or the link is out of date.<br><br>Ask the colorist to send you a new link.</div>
<script>
const T = {
  ru: ['Трансляция завершена', 'Трансляция завершена или ссылка устарела.<br><br>Попросите колориста прислать новую ссылку.'],
  kk: ['Трансляция аяқталды', 'Трансляция аяқталды немесе сілтеменің мерзімі өтті.<br><br>Колористтен жаңа сілтеме жіберуін сұраңыз.'],
};
const lg = (navigator.language || '').slice(0, 2).toLowerCase(), t = T[lg];
if (t) { document.documentElement.lang = lg; document.title = t[0]; document.getElementById('m').innerHTML = t[1]; }
</script></body></html>
