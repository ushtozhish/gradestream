<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Просмотр цветокоррекции</title>
<style>
  html, body { margin:0; height:100%; background:#000; color:#ddd; overflow:hidden; touch-action:manipulation;
               font:15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select:none; user-select:none; }
  canvas, #lv { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #lv { display:none; }
  #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:28px; color:#999; pointer-events:none; }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(12px + env(safe-area-inset-bottom));
         display:flex; gap:8px; justify-content:center; flex-wrap:wrap; background:linear-gradient(transparent, rgba(0,0,0,.75)); transition:opacity .3s; }
  #bar, #note, #hint { z-index:7; }
  #bar.hidden { opacity:0; pointer-events:none; }
  button { background:rgba(40,40,40,.88); color:#eee; border:1px solid #555; border-radius:20px; padding:9px 16px; font:inherit; }
  button.on { background:#e0a040; color:#111; border-color:#e0a040; }
  #info { position:fixed; top:calc(8px + env(safe-area-inset-top)); left:10px; font-size:11px; color:#888; display:none; background:rgba(0,0,0,.5); padding:2px 6px; border-radius:4px; }
  #pause { position:fixed; top:calc(8px + env(safe-area-inset-top)); right:10px; font-size:12px; color:#111; background:#e0a040; padding:3px 9px; border-radius:10px; display:none; }
  #hint { position:fixed; top:calc(40px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); background:rgba(224,160,64,.95); color:#111; padding:6px 12px; border-radius:14px; font-size:13px; display:none; white-space:nowrap; }
  .ping { position:fixed; width:28px; height:28px; margin:-14px 0 0 -14px; border:2px solid #e0a040; border-radius:50%; pointer-events:none; animation:fade 1.5s forwards; }
  @keyframes fade { from { transform:scale(.5); opacity:1 } to { transform:scale(1.6); opacity:0 } }
  #note { position:fixed; left:50%; bottom:calc(70px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:rgba(0,0,0,.75); color:#ccc;
          padding:6px 12px; border-radius:12px; font-size:13px; display:none; }

  /* ---------- Скопы ---------- */
  #scopes { position:fixed; right:10px; top:calc(10px + env(safe-area-inset-top)); z-index:5; display:none; max-width:calc(100vw - 20px);
            max-height:calc(100vh - 90px); overflow:auto; background:rgba(8,8,8,var(--scA,.82)); border:1px solid #444; border-radius:10px;
            font-size:12px; touch-action:none; }
  #scopes.show { display:block; }
  #scHead { display:flex; flex-wrap:wrap; gap:4px; padding:6px; cursor:move; border-bottom:1px solid #333; }
  #scHead button { padding:4px 9px; border-radius:12px; font-size:12px; }
  #scHead .sp { flex:1; min-width:6px; }
  #scBody { display:flex; flex-wrap:wrap; gap:6px; padding:6px; }
  #scBody canvas { position:static; display:block; width:var(--scW,260px); height:auto; background:#050505; border-radius:4px; }
  #scBody canvas.sq { width:calc(var(--scW,260px) * .62); }
  /* режим «Скопы крупно»: скопы на весь экран, картинка — маленькое окно */
  #scopes.big { inset:0; left:0 !important; top:0 !important; right:0 !important; max-width:none; max-height:none; border:none; border-radius:0;
                background:#000; padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); box-sizing:border-box; overflow:hidden; }
  #scopes.big #scHead { cursor:default; }
  #scopes.big #scBody { padding:6px 10px; gap:10px; align-content:center; justify-content:center; box-sizing:border-box; }
  body.scbig #c, body.scbig #lv { inset:auto; z-index:6; width:var(--pipW); height:calc(var(--pipW) * 9 / 16); left:var(--pipL); top:var(--pipT);
                                  border:1px solid #555; border-radius:6px; box-sizing:border-box; }
  #scNote { padding:0 8px 7px; color:#888; font-size:11px; max-width:520px; display:none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<video id="lv" muted autoplay playsinline disablepictureinpicture></video>
<div id="status" data-en="Connecting…">Подключаюсь…</div>
<div id="hint" data-en="Tap a spot on the frame">Коснитесь места на кадре</div>
<div id="pause" data-en="Paused">Пауза</div>
<div id="info"></div>
<div id="note"></div>
<div id="scopes">
  <div id="scHead">
    <button data-sc="wave" data-en="Waveform">Waveform</button>
    <button data-sc="parade" data-en="Parade">Парад</button>
    <button data-sc="vector" data-en="Vector">Вектор</button>
    <button data-sc="hist" data-en="Histogram">Гистограмма</button>
    <span class="sp"></span>
    <button id="scBig"></button>
    <button id="scMode" title="Waveform: яркость (Y) или каналы RGB" data-en-title="Waveform: luma (Y) or RGB channels">Y</button>
    <button id="scZoom" title="Увеличение вектороскопа" data-en-title="Vectorscope zoom">1×</button>
    <button id="scGain" title="Яркость следа" data-en-title="Trace brightness">☀</button>
    <button id="scSize" title="Размер" data-en-title="Size">M</button>
    <button id="scHelp">?</button>
    <button id="scClose">✕</button>
  </div>
  <div id="scBody"></div>
  <div id="scNote"></div>
</div>
<div id="bar">
  <button id="btnSound" style="display:none" data-en="Turn sound on">Включить звук</button>
  <button id="btnMark" data-en="Mark a point">Отметить точку</button>
  <button id="btnFull" style="display:none" data-en="Fullscreen">На весь экран</button>
  <button id="btnScopes" style="display:none" data-en="Scopes">Скопы</button>
  <button id="btnInfo">i</button>
  <button id="btnHide" data-en="Hide">Скрыть</button>
</div>

<script>
const ROOM = '__ROOM__';
// Язык страницы — по языку телефона зрителя
const LANG = ['ru', 'kk', 'be', 'uk'].includes((navigator.language || '').slice(0, 2)) ? 'ru' : 'en';
const L = (ru, en) => LANG === 'en' ? en : ru;
document.documentElement.lang = LANG;
if (LANG === 'en') { document.querySelectorAll('[data-en]').forEach(el => { el.textContent = el.dataset.en; }); document.querySelectorAll('[data-en-title]').forEach(el => { el.title = el.dataset.enTitle; }); }
document.title = L('Просмотр цветокоррекции', 'Color grading preview');
const LAN = __LAN__;   // открыто по ссылке внутри сети: видео приходит по WebRTC напрямую по Wi-Fi
const $ = id => document.getElementById(id);
const canvas = $('c');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1920, 1080);

let shownTs = 0;
let ws = null, decoder = null, cfg = null, waitKey = true, live = false;
let gotFrame = false, frames = 0, bytes = 0, markMode = false, retry = 0;

function status(t) { $('status').textContent = t || ''; $('status').style.display = t ? 'flex' : 'none'; }
function note(t) { $('note').textContent = t; $('note').style.display = 'block'; clearTimeout(note.t); note.t = setTimeout(() => $('note').style.display = 'none', 2500); }

if (LAN) {
  canvas.style.display = 'none';
  $('lv').style.display = 'block';
  if (!('RTCPeerConnection' in window)) status(L('Этот браузер не умеет принимать видео по сети. Откройте ссылку в Safari (iPhone) или Chrome (Android).', 'This browser cannot receive video over the network. Open the link in Safari (iPhone) or Chrome (Android).'));
  else connect();
} else if (!('VideoDecoder' in window)) {
  status(L('Этот браузер слишком старый для просмотра. На iPhone обновите iOS до 16.4 или новее и откройте ссылку в Safari. На Android — в Chrome.', 'This browser is too old. On iPhone, update to iOS 16.4 or later and open the link in Safari. On Android, use Chrome.'));
} else {
  connect();
}

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/view?room=${ROOM}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { retry = 0; };
  ws.onclose = () => {
    status(gotFrame ? '' : L('Нет связи, переподключаюсь…', 'No connection, reconnecting…'));
    if (gotFrame) note(L('Связь прервалась, переподключаюсь…', 'Connection lost, reconnecting…'));
    setTimeout(connect, Math.min(5000, 500 * ++retry));
  };
  ws.onmessage = e => {
    if (typeof e.data === 'string') return onText(JSON.parse(e.data));
    const t = new Uint8Array(e.data, 0, 1)[0];
    if (t <= 1) onFrame(e.data);
    else if (t === 3) onOpus(e.data);
    else if (t === 4) onPCM(e.data);
  };
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function onText(m) {
  if (m.t === 'hello') {
    live = m.live; if (!live) status(L('Трансляция ещё не началась. Ожидайте…', 'The stream hasn’t started yet. Please wait…'));
    if (LAN) { startRTC(); return; }
    sendCaps();
    if (soundOn) send({ t: 'audio-want', on: true });
  }
  else if (m.t === 'rtc-offer') onRtcOffer(m);
  else if (m.t === 'rtc-ice') { if (pc && m.c) pc.addIceCandidate(m.c).catch(() => {}); }
  else if (m.t === 'rtc-error') status(L('Не удалось начать показ: ', 'Could not start playback: ') + m.error);
  else if (m.t === 'scopes') Scopes.allow(!!m.on);
  else if (m.t === 'playout') { playMode = m.mode === 'sync' ? 'sync' : 'live'; applyReceiverMode(); }
  else if (m.t === 'audio') { if (LAN) $('btnSound').style.display = m.on ? '' : 'none'; else onAudioConfig(m); }
  else if (m.t === 'config') { if (!LAN) setupDecoder(m); }
  else if (m.t === 'live') {
    live = m.on;
    if (LAN) { $('lv').style.visibility = live ? 'visible' : 'hidden'; if (live) { $('lv').play().catch(() => {}); if (!gotFrame) status(L('Загружаю картинку…', 'Loading the picture…')); } }
    if (!live) { if (!LAN) onAudioConfig({ on: false }); status(L('Трансляция остановлена', 'The stream has stopped')); gotFrame = false; $('pause').style.display = 'none'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1920, 1080); }
  }
  else if (m.t === 'pause') $('pause').style.display = m.on ? 'block' : 'none';
}

// ---------- Внутри сети: WebRTC ----------
// Синхронность звука и картинки обеспечивает сам браузер по отчётам отправителя (время захвата).
// Режим «ровно»: просим буфер ~200 мс под разброс Wi-Fi; «минимальная задержка» — без буфера.
const receivers = [];
function applyReceiverMode() {
  for (const r of receivers) {
    const ms = playMode === 'sync' ? 200 : 0;
    try { if ('jitterBufferTarget' in r) r.jitterBufferTarget = ms; else r.playoutDelayHint = ms / 1000; } catch {}
  }
}
let pc = null, rtcRetry = null, lagMs = 150, lastBytesRx = 0, rxFps = 0, rxMbps = 0;
const lv = $('lv');
function startRTC() {
  clearTimeout(rtcRetry);
  if (pc) { try { pc.close(); } catch {} pc = null; }
  if (!live) status(L('Трансляция ещё не началась. Ожидайте…', 'The stream hasn’t started yet. Please wait…')); else status(L('Соединяюсь по Wi-Fi…', 'Connecting over Wi-Fi…'));
  send({ t: 'rtc-start' });
}
async function onRtcOffer(m) {
  if (pc) { try { pc.close(); } catch {} }
  const p = pc = new RTCPeerConnection({ iceServers: [] });   // только локальная сеть
  const stream = new MediaStream();
  p.ontrack = e => {
    stream.addTrack(e.track);
    receivers.push(e.receiver); applyReceiverMode();
    if (lv.srcObject !== stream) lv.srcObject = stream;
    lv.play().catch(() => {});
  };
  p.onicecandidate = e => { if (e.candidate) send({ t: 'rtc-ice', c: e.candidate.toJSON() }); };
  p.onconnectionstatechange = () => {
    if (p !== pc) return;
    const st = p.connectionState;
    if (st === 'connected') { if (!live) status(L('Трансляция ещё не началась. Ожидайте…', 'The stream hasn’t started yet. Please wait…')); }
    else if (st === 'failed') {
      status(L('Не получилось соединиться по Wi-Fi. Проверьте, что телефон в той же сети, что и компьютер (не гостевая сеть), и что на компьютере GradeStream разрешён в брандмауэре. Пробую снова…', 'Could not connect over Wi-Fi. Make sure the phone is on the same network as the computer (not a guest network) and that GradeStream is allowed in the computer’s firewall. Retrying…'));
      rtcRetry = setTimeout(startRTC, 4000);
    } else if (st === 'disconnected') note(L('Связь по Wi-Fi прерывается…', 'The Wi-Fi connection is unstable…'));
  };
  try {
    await p.setRemoteDescription({ type: 'offer', sdp: m.sdp });
    const ans = await p.createAnswer();
    // Попросить стерео: иначе Chrome сводит звук Opus в моно
    const opt = (ans.sdp.match(/a=rtpmap:(\d+) opus\/48000/i) || [])[1];
    if (opt) ans.sdp = ans.sdp.replace(new RegExp('(a=fmtp:' + opt + ' [^\\r\\n]*)'), (m0) => /stereo=1/.test(m0) ? m0 : m0 + ';stereo=1;sprop-stereo=1');
    await p.setLocalDescription(ans);
    send({ t: 'rtc-answer', sdp: p.localDescription.sdp });
  } catch (e) { status(L('Ошибка соединения: ', 'Connection error: ') + e.message); }
}
lv.addEventListener('playing', () => { if (live) { gotFrame = true; status(''); } });
lv.addEventListener('resize', () => { if (live && lv.videoWidth) { gotFrame = true; status(''); } });
// Задержка показа у телефона — чтобы скриншот метки был именно того кадра, который здесь виден
setInterval(async () => {
  if (!LAN || !pc) return;
  try {
    const rep = await pc.getStats();
    let jb = null, rtt = 0;
    rep.forEach(r => {
      if (r.type === 'inbound-rtp' && r.kind === 'video') {
        if (r.jitterBufferEmittedCount) jb = r.jitterBufferDelay / r.jitterBufferEmittedCount * 1000;
        rxFps = r.framesPerSecond || 0;
        if (r.bytesReceived != null) { rxMbps = (r.bytesReceived - lastBytesRx) * 8 / 1e6; lastBytesRx = r.bytesReceived; }
      }
      if (r.type === 'candidate-pair' && r.nominated && r.currentRoundTripTime != null) rtt = r.currentRoundTripTime * 1000;
    });
    if (jb != null) lagMs = Math.round(jb + rtt / 2 + 30);
  } catch {}
}, 1000);

function unb64(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

async function setupDecoder(m) {
  const c = { codec: m.codec, codedWidth: m.w, codedHeight: m.h, optimizeForLatency: true };
  if (m.description) c.description = unb64(m.description);
  if (m.colorSpace) c.colorSpace = m.colorSpace;
  try {
    const s = await VideoDecoder.isConfigSupported(c);
    if (!s.supported) { delete c.colorSpace; const s2 = await VideoDecoder.isConfigSupported(c); if (!s2.supported) { status(L('Устройство не может декодировать это видео (H.264 ', 'This device cannot decode this video (H.264 ') + m.codec + ').'); return; } }
  } catch {}
  cfg = c;
  resetDecoder();
  if (!gotFrame) status(L('Загружаю картинку…', 'Loading the picture…'));
}

// ---------- Синхронная подача: звук вместе с картинкой, кадры ровно ----------
// Каждый кадр и блок звука помечены временем захвата по часам программы. Зритель оценивает,
// с какой задержкой они приходят (сеть + разница часов) и как сильно она скачет, и выдаёт
// всё по формуле «время захвата + задержка + буфер». Одинаковая задержка для звука и видео
// = синхронность; буфер под разброс сети = ровный ритм кадров.
let playMode = 'live';                       // режим, выбранный в программе
const localUs = () => (performance.timeOrigin + performance.now()) * 1000;
const syncOn = () => playMode === 'sync' || soundOn;
const arrivals = { v: [], a: [] };
function noteArrival(kind, ts) {
  const now = localUs(), list = arrivals[kind];
  list.push([now, now - ts]);
  while (list.length && now - list[0][0] > 8e6) list.shift();
}
function minDelay(list) { let m = Infinity; for (const x of list) if (x[1] < m) m = x[1]; return m; }
function spread(list, base) {
  if (list.length < 8) return 80000;
  const v = list.map(x => x[1] - base).sort((a, b) => a - b);
  return v[Math.floor(v.length * 0.95)];
}
let playBase = null, playDelay = 200000, lastPlan = 0;
function plan() {
  const t = performance.now();
  if (playBase !== null && t - lastPlan < 500) return;
  lastPlan = t;
  const useA = soundOn && arrivals.a.length > 5;
  const mv = minDelay(arrivals.v), ma = useA ? minDelay(arrivals.a) : -Infinity;
  if (!isFinite(mv) && !useA) return;
  const base = Math.max(mv, ma);
  const sp = Math.max(isFinite(mv) ? spread(arrivals.v, mv) : 0, useA ? spread(arrivals.a, ma) : 0);
  const target = Math.min(700000, Math.max(120000, sp + 60000));
  playDelay = target > playDelay ? target : playDelay * 0.95 + target * 0.05;   // растёт сразу, падает плавно
  playBase = (playBase === null || Math.abs(base - playBase) > 40000) ? base : playBase * 0.9 + base * 0.1;
}
const presentUs = ts => ts + playBase + playDelay;

// Очередь декодированных кадров (ImageBitmap — чтобы сразу вернуть кадр декодеру)
const vq = []; let vchain = Promise.resolve();
function queueFrame(f) {
  plan();
  const ts = f.timestamp, at = playBase === null ? localUs() : presentUs(ts);
  vchain = vchain.then(() => createImageBitmap(f)).then(bmp => {
    f.close(); vq.push({ bmp, ts, at });
    while (vq.length > 45) vq.shift().bmp.close();
  }).catch(() => { try { f.close(); } catch {} });
}
function showBitmap(item) {
  ctx.drawImage(item.bmp, 0, 0, 1920, 1080);
  shownTs = item.ts; item.bmp.close(); frames++; Scopes.dirty = true;
  if (window.__avProbe) window.__avProbe('v', item.ts, performance.now());
  if (!gotFrame) { gotFrame = true; status(''); ensureFsVideo(); }
}
(function tick() {
  requestAnimationFrame(tick);
  if (!vq.length) return;
  if (!syncOn()) { while (vq.length > 1) vq.shift().bmp.close(); showBitmap(vq.shift()); return; }
  const now = localUs(); let show = null;
  while (vq.length && vq[0].at <= now) { if (show) show.bmp.close(); show = vq.shift(); }
  if (show) showBitmap(show);
})();

// Время по часам страницы (мкс) → время аудиоконтекста, с учётом задержки аудиовыхода
function ctxTimeFor(atUs) {
  const perfMs = atUs / 1000 - performance.timeOrigin;
  if (actx.getOutputTimestamp) {
    const o = actx.getOutputTimestamp();
    if (o.performanceTime) return o.contextTime + (perfMs - o.performanceTime) / 1000;
  }
  return actx.currentTime + (perfMs - performance.now()) / 1000 - (actx.outputLatency || actx.baseLatency || 0);
}

function resetDecoder() {
  if (decoder && decoder.state !== 'closed') { try { decoder.close(); } catch {} }
  decoder = new VideoDecoder({
    output: f => {
      if (syncOn()) { queueFrame(f); return; }
      ctx.drawImage(f, 0, 0, 1920, 1080);
      shownTs = f.timestamp;   // какой кадр сейчас на экране — для скриншота метки
      f.close();
      frames++;
      if (window.__avProbe) window.__avProbe('v', shownTs, performance.now());
      if (!gotFrame) { gotFrame = true; status(''); ensureFsVideo(); }
    },
    error: e => { console.warn(e); setTimeout(() => { if (cfg) { resetDecoder(); askKey(); } }, 100); },
  });
  decoder.configure(cfg);
  waitKey = true;
  askKey();
}

let lastAsk = 0;
function askKey() { const n = performance.now(); if (n - lastAsk > 800) { lastAsk = n; send({ t: 'kf' }); } }

function onFrame(buf) {
  bytes += buf.byteLength;
  if (!decoder || decoder.state !== 'configured') return;
  const dv = new DataView(buf);
  const isKey = dv.getUint8(0) === 1;
  const ts = dv.getFloat64(1);
  noteArrival('v', ts);
  if (waitKey && !isKey) { askKey(); return; }
  // Декодер отстаёт (слабый телефон) — ждём следующий ключевой кадр, чтобы не копить задержку
  if (!isKey && decoder.decodeQueueSize > 6) { waitKey = true; askKey(); return; }
  try {
    decoder.decode(new EncodedVideoChunk({ type: isKey ? 'key' : 'delta', timestamp: ts, data: new Uint8Array(buf, 9) }));
    if (isKey) waitKey = false;
  } catch (e) { console.warn(e); waitKey = true; askKey(); }
}

// ---------- Звук ----------
let actx = null, soundOn = false, acfg = null, adec = null, nextTime = 0, opusOK = null;

async function sendCaps() {
  if (opusOK === null) {
    opusOK = false;
    if ('AudioDecoder' in window) {
      try { opusOK = (await AudioDecoder.isConfigSupported({ codec: 'opus', sampleRate: 48000, numberOfChannels: 2 })).supported; } catch {}
    }
  }
  send({ t: 'caps', opus: opusOK });
}

function onAudioConfig(m) {
  acfg = m.on ? m : null;
  $('btnSound').style.display = acfg ? '' : 'none';
  if (!acfg) { closeDecoder(); return; }
  if (soundOn && opusOK) setupAudioDecoder();
}

function closeDecoder() { if (adec && adec.state !== 'closed') { try { adec.close(); } catch {} } adec = null; }

function setupAudioDecoder() {
  closeDecoder();
  if (!acfg || !opusOK) return;
  const c = { codec: 'opus', sampleRate: 48000, numberOfChannels: 2 };
  if (acfg.description) c.description = unb64(acfg.description);
  adec = new AudioDecoder({
    output: ad => {
      const n = ad.numberOfFrames, ch = Math.min(2, ad.numberOfChannels);

}

// Небольшой буфер ~150 мс: звук без щелчков и почти без задержки
// Звук ставится на момент «время захвата + общая задержка» — тот же, что и у кадров
function schedule(buf, ts) {
  if (!actx || !soundOn) return;
  plan();
  if (playBase === null) return;
  const ideal = ctxTimeFor(presentUs(ts)), now = actx.currentTime;
  if (ideal < now + 0.005) return;                                   // опоздал — пропускаем
  if (Math.abs(nextTime - ideal) > 0.025 || nextTime < now + 0.005) nextTime = ideal;   // привязка заново
  const src = actx.createBufferSource();
  src.buffer = buf;
  src.connect(actx.destination);
  src.start(nextTime);
  if (window.__avProbe) window.__avProbe('a', ts, nextTime, buf, actx);
  nextTime += buf.duration;
}

function onOpus(buf) {
  if (!soundOn || !adec || adec.state !== 'configured') return;
  const dv = new DataView(buf);
  noteArrival('a', dv.getFloat64(1));
  try { adec.decode(new EncodedAudioChunk({ type: 'key', timestamp: dv.getFloat64(1), data: new Uint8Array(buf, 9) })); } catch (e) { console.warn(e); }
}

// Облегчённый звук для устройств без декодера Opus: int16, 24 кГц, стерео
function onPCM(buf) {
  if (!soundOn || !actx) return;
  const pts = new DataView(buf).getFloat64(1);
  noteArrival('a', pts);
  const s16 = new Int16Array(buf.slice(9));
  const n = s16.length / 2;
  const b = actx.createBuffer(2, n, 24000);
  const chL = b.getChannelData(0), chR = b.getChannelData(1);
  for (let i = 0; i < n; i++) { chL[i] = s16[2 * i] / 32768; chR[i] = s16[2 * i + 1] / 32768; }
  schedule(b, pts);
}

// ---------- Скопы: waveform, RGB-парад, вектороскоп, гистограмма ----------

  const save = () => { try { localStorage.setItem('gs.view.scopes', JSON.stringify(st)); } catch {} };
  let allowed = false, lastT = 0, lastLvTime = -1;

    document.body.style.setProperty('--pipW', pipW + 'px');
    document.body.style.setProperty('--pipL', pipL + 'px');
    document.body.style.setProperty('--pipT', top + 'px');

    const rows = Math.ceil(list.length / bestCols), cw = (areaW - 20) / bestCols - 10, ch = (areaH - 12) / rows - 10;
    for (const k of list) views[k].cv.style.width = Math.max(60, Math.floor(Math.min(cw, ch * asp(k)))) + 'px';
    dirty = true;
  }

    const r = panel.getBoundingClientRect();

  // ---- расчёт ----

      c.strokeStyle = 'rgba(230,200,120,.75)'; c.strokeRect(x - 5 * s, y - 5 * s, 10 * s, 10 * s);
      const [cb1, cr1] = cbcr(R, G, B); c.fillStyle = 'rgba(230,200,120,.6)'; c.fillRect(cx + cb1 * k - 1.5 * s, cy - cr1 * k - 1.5 * s, 3 * s, 3 * s);
      const lx = cx + cb * k * 1.32, ly = cy - cr * k * 1.32;
      if (lx > 8 * s && lx < W - 8 * s && ly > 8 * s && ly < H - 4 * s) label(c, t, lx, ly + 4 * dpr, dpr, 'center');
    }
    if (st.zoom > 1) label(c, st.zoom + '×', W - 4 * dpr, H - 5 * dpr, dpr, 'right');
  }
  function gridHist(v) {
    const [c, W, H, dpr] = canvasFor(v);
    c.strokeStyle = 'rgba(230,200,120,.28)';
    for (const lv10 of [256, 512, 768]) { const x = Math.round(lv10 / 1023 * W) + .5; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
    label(c, '0', 3 * dpr, H - 4 * dpr, dpr); label(c, '1023', W - 3 * dpr, H - 4 * dpr, dpr, 'right');
  }

  function frame() {
    requestAnimationFrame(frame);
    if (!st.open || document.hidden) return;
    // до 10 обновлений в секунду; если телефон считает медленно — реже, чтобы не грелся и не мешал видео
    const now = performance.now(); if (now - lastT < Math.max(95, cost * 4)) return;
    const px = grab(); if (!px) return; lastT = now;
    if (st.on.wave) { waveform(px, fit(views.wave), false); gridWave(views.wave, false); }
    if (st.on.parade) { waveform(px, fit(views.parade), true); gridWave(views.parade, true); }
    if (st.on.vector) { vectorscope(px, fit(views.vector)); gridVector(views.vector); }
    if (st.on.hist) { histogram(px, fit(views.hist)); gridHist(views.hist); }
    cost = cost * 0.7 + (performance.now() - now) * 0.3;
  }
  let cost = 20;
  requestAnimationFrame(frame);

  // ---- управление ----
  panel.addEventListener('click', e => e.stopPropagation());
  for (const b of panel.querySelectorAll('[data-sc]')) b.onclick = () => {
    st.on[b.dataset.sc] = !st.on[b.dataset.sc];
    if (!Object.values(st.on).some(Boolean)) st.on[b.dataset.sc] = true;   // хотя бы один скоп
    save(); layout();
  };
  $('scBig').onclick = () => { st.big = !st.big; save(); layout(); };
  $('scMode').onclick = () => { st.mode = st.mode === 'Y' ? 'RGB' : 'Y'; save(); layout(); };
  $('scZoom').onclick = () => { st.zoom = st.zoom === 1 ? 2 : st.zoom === 2 ? 4 : 1; save(); layout(); };
  $('scGain').onclick = () => { st.gain = (st.gain + 1) % GAINS.length; save(); dirty = true; };
  $('scSize').onclick = () => { st.size = SIZE_ORDER[(SIZE_ORDER.indexOf(st.size) + 1) % SIZE_ORDER.length]; save(); layout(); };
  $('scClose').onclick = () => show(false);
  $('scHelp').onclick = () => {
    const n = $('scNote'); const vis = n.style.display === 'block'; n.style.display = vis ? 'none' : 'block';
    n.textContent = L('Скопы считаются на этом телефоне по картинке, которая пришла по сети (8 бит, после сжатия), по копии кадра 512×576. Шкала 0–1023 как в Resolve. Общие уровни, баланс и насыщенность совпадают с Resolve с точностью около 1%; мелкие одиночные блики могут сглаживаться. Квадратики на вектороскопе — цветные полосы 75%, линия — тон кожи. Окошко можно перетаскивать за верхнюю строку. «Скопы крупно» — скопы на весь экран, картинка в маленьком окне (на нём тоже можно ставить метки).',
      'Scopes are computed on this phone from the picture that arrived over the network (8-bit, after compression), from a 512×576 copy of the frame. The 0–1023 scale matches Resolve. Overall levels, balance and saturation match Resolve within about 1%; tiny isolated highlights may be smoothed. Boxes on the vectorscope are 75% color bars, the line is the skin tone. Drag the window by its top row. «Big scopes» puts the scopes full screen with the picture in a small window (you can still place markers on it).');
  };
  // перетаскивание за заголовок
  let drag = null;
  $('scHead').addEventListener('pointerdown', e => {
    if (e.target.tagName === 'BUTTON' || st.big) return;
    const r = panel.getBoundingClientRect(); drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    $('scHead').setPointerCapture(e.pointerId);
  });
  $('scHead').addEventListener('pointermove', e => { if (!drag) return; st.x = e.clientX - drag.dx; st.y = e.clientY - drag.dy; place(); });
  $('scHead').addEventListener('pointerup', () => { if (drag) { drag = null; save(); } });
  window.addEventListener('resize', () => { if (st.open) layout(); });
  $('btnScopes').onclick = e => { e.stopPropagation(); show(!st.open); };

  return {
    set dirty(v) { dirty = v; },
    allow(on) {
      allowed = on;
      $('btnScopes').style.display = on ? '' : 'none';
      if (!on) { if (st.open) note(L('Колорист выключил скопы', 'The colorist turned scopes off')); panel.classList.remove('show', 'big'); document.body.classList.remove('scbig'); $('btnScopes').classList.remove('on'); }
      else if (st.open) show(true);
    },
  };
})();

// ---------- Интерфейс ----------
$('btnHide').onclick = e => { e.stopPropagation(); $('bar').classList.add('hidden'); note(L('Коснитесь экрана, чтобы вернуть кнопки', 'Tap the screen to bring back the buttons')); };
$('btnInfo').onclick = e => { e.stopPropagation(); const i = $('info'); i.style.display = i.style.display === 'block' ? 'none' : 'block'; };
// ---------- Во весь экран ----------
// Android, iPad, компьютер — полноэкранный режим страницы (метки остаются доступны).
// iPhone не разрешает развернуть страницу, поэтому картинка дублируется в видеоэлемент
// и открывается в системном полноэкранном плеере iOS (для метки — выйти из него).
const fsEl = document.documentElement;
const pageFS = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
let fsVideo = null;
function ensureFsVideo() {
  if (pageFS || fsVideo || !canvas.captureStream) return;
  fsVideo = document.createElement('video');
  fsVideo.muted = true; fsVideo.autoplay = true; fsVideo.playsInline = true;
  fsVideo.setAttribute('playsinline', ''); fsVideo.setAttribute('muted', '');
  fsVideo.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none';
  fsVideo.srcObject = canvas.captureStream(30);
  document.body.appendChild(fsVideo);
  fsVideo.play().catch(() => {});
}
$('btnFull').style.display = '';
$('btnFull').onclick = e => {
  e.stopPropagation();
  if (pageFS) {
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const p = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
    if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch {} }).catch(() => {});
    $('bar').classList.add('hidden');
    note(L('Коснитесь экрана, чтобы вернуть кнопки', 'Tap the screen to bring back the buttons'));
    return;
  }
  if (!LAN) ensureFsVideo();
  const fv = LAN ? lv : fsVideo;
  if (fv && fv.webkitEnterFullscreen) {
    fv.play().catch(() => {});
    try { fv.webkitEnterFullscreen(); } catch { note(L('Поверните телефон горизонтально', 'Turn the phone sideways')); }
  } else note(L('Поверните телефон горизонтально — картинка займёт весь экран', 'Turn the phone sideways — the picture will fill the screen'));
};
document.addEventListener('fullscreenchange', () => { $('btnFull').textContent = document.fullscreenElement ? L('Свернуть', 'Exit fullscreen') : L('На весь экран', 'Fullscreen'); });

setInterval(() => {
  $('info').textContent = LAN
    ? L(`Wi-Fi напрямую · ${lv.videoWidth || '?'}×${lv.videoHeight || '?'} · ${Math.round(rxFps)} к/с · ${rxMbps.toFixed(1)} Мбит/с · задержка ~${lagMs} мс`, `Wi-Fi direct · ${lv.videoWidth || '?'}×${lv.videoHeight || '?'} · ${Math.round(rxFps)} fps · ${rxMbps.toFixed(1)} Mbit/s · latency ~${lagMs} ms`)
    : L(`1920×1080 · ${frames} к/с · ${(bytes * 8 / 1e6).toFixed(1)} Мбит/с`, `1920×1080 · ${frames} fps · ${(bytes * 8 / 1e6).toFixed(1)} Mbit/s`);
  frames = 0; bytes = 0;
}, 1000);

async function keepAwake() { try { await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); if (LAN) lv.play().catch(() => {}); if (cfg) { waitKey = true; askKey(); } } });
keepAwake();
</script>
</body>
</html>
